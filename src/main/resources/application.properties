server.port=8083
server.servlet.context-path=/eldercare

# ── DataSource ──────────────────────────────────────────────
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/eldercare_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin

# ── JPA / Hibernate ─────────────────────────────────────────
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ─────────────────────────────────────────────────────
jwt.secret=eldercare-secret-key-must-be-at-least-256-bits-long-for-hs256
jwt.expiration.ms=36000000

# ── Actuator ────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,mappings
management.endpoint.health.show-details=always

# ── Vitals Thresholds ────────────────────────────────────────
vitals.threshold.systolic-min=90
vitals.threshold.systolic-max=139
vitals.threshold.diastolic-min=60
vitals.threshold.diastolic-max=89
vitals.threshold.hr-min=60
vitals.threshold.hr-max=100
vitals.threshold.temp-min=97.0
vitals.threshold.temp-max=99.5
vitals.threshold.spo2-min=95

# ── Springdoc / Swagger UI ──────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=alpha

# ── Token cleanup scheduler (daily midnight) ─────────────────
app.token.cleanup.cron=0 0 0 * * *

# ── Medication slot missed check (every hour) ────────────────
app.slot.missed.cron=0 0 * * * *

